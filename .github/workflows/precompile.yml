name: Build precompiled NIFs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TA_LIB_VERSION: "0.6.4"
  MIX_ENV: prod

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-linux-gnu
            cross_pkg: ""
            ta_lib_host: ""
          - arch: aarch64
            target: aarch64-linux-gnu
            cross_pkg: gcc-aarch64-linux-gnu
            ta_lib_host: "--host=aarch64-linux-gnu"
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - name: Install cross-compiler
        if: matrix.cross_pkg != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_pkg }}

      - name: Build ta-lib from source
        run: |
          curl -L -o ta-lib-src.tar.gz \
            "https://github.com/TA-Lib/ta-lib/releases/download/v${TA_LIB_VERSION}/ta-lib-${TA_LIB_VERSION}-src.tar.gz"
          tar xzf ta-lib-src.tar.gz
          cd ta-lib-${TA_LIB_VERSION}
          if [ -n "${{ matrix.cross_pkg }}" ]; then
            export CC=${{ matrix.target }}-gcc
          fi
          ./configure --prefix="${{ github.workspace }}/ta-lib-install" \
            ${{ matrix.ta_lib_host }} \
            --enable-static --disable-shared
          make -j$(nproc)
          make install

      - name: Generate code from ta-lib
        run: |
          export TA_LIB_DIR="${{ github.workspace }}/ta-lib-install"
          make -C tools
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix talib

      - name: Build precompiled NIF
        run: |
          export TA_LIB_DIR="${{ github.workspace }}/ta-lib-install"
          export ELIXIR_MAKE_CACHE_DIR="$(pwd)/cache"
          mkdir -p "${ELIXIR_MAKE_CACHE_DIR}"
          mix elixir_make.precompile

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nif-linux-${{ matrix.arch }}
          path: cache/*.tar.gz

  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target_arch: ""
          - arch: x86_64
            target_arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang and Elixir
        run: |
          brew install erlang elixir

      - name: Build ta-lib from source
        run: |
          curl -L -o ta-lib-src.tar.gz \
            "https://github.com/TA-Lib/ta-lib/releases/download/v${TA_LIB_VERSION}/ta-lib-${TA_LIB_VERSION}-src.tar.gz"
          tar xzf ta-lib-src.tar.gz
          cd ta-lib-${TA_LIB_VERSION}
          if [ -n "${{ matrix.target_arch }}" ]; then
            export CFLAGS="-arch ${{ matrix.target_arch }}"
            export LDFLAGS="-arch ${{ matrix.target_arch }}"
            ./configure --prefix="${{ github.workspace }}/ta-lib-install" \
              --host=${{ matrix.target_arch }}-apple-darwin \
              --enable-static --disable-shared
          else
            ./configure --prefix="${{ github.workspace }}/ta-lib-install" \
              --enable-static --disable-shared
          fi
          make -j$(sysctl -n hw.ncpu)
          make install

      - name: Generate code from ta-lib
        run: |
          export TA_LIB_DIR="${{ github.workspace }}/ta-lib-install"
          make -C tools
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix talib

      - name: Build precompiled NIF
        run: |
          export TA_LIB_DIR="${{ github.workspace }}/ta-lib-install"
          export ELIXIR_MAKE_CACHE_DIR="$(pwd)/cache"
          export CC_PRECOMPILER_PRECOMPILE_ONLY_LOCAL=true
          mkdir -p "${ELIXIR_MAKE_CACHE_DIR}"
          mix elixir_make.precompile

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nif-macos-${{ matrix.arch }}
          path: cache/*.tar.gz

  release:
    runs-on: ubuntu-latest
    needs: [linux, macos]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nif-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz

  checksum:
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - name: Generate checksums
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix elixir_make.checksum \
            --all \
            --ignore-unavailable \
            --print

      - name: Upload checksum file
        uses: actions/upload-artifact@v4
        with:
          name: checksum
          path: checksum-talib_ex_nif.exs
